[workspace]
resolver = "2"
members = ["crates/glyph", "crates/videoin", "crates/overview", "crates/glb-undraco", "crates/positions-gui"]

# OCR (NCC template matching, `crates/glyph`) is pixel-loop-heavy; at opt-level 0 the video test
# bed in `crates/overview` (every frame of a several-second clip) takes minutes instead of
# seconds. This only affects test/bench binaries, not normal `cargo build`/`cargo run` compile
# times.
[profile.test]
opt-level = 3

# The OCR hot loops (`crates/glyph`'s matcher) are small enough that cross-crate inlining pays off.
[profile.release]
lto = "fat"
codegen-units = 1
