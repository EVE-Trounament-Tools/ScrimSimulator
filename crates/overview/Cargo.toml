[package]
name = "overview"
version = "0.1.0"
edition = "2021"
description = "Overview layout, row parsing, and per-pilot tracking (DESIGN.md S4.4 overview)"

[dependencies]
glyph = { path = "../glyph" }
videoin = { path = "../videoin" }
image = { version = "0.25", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
fast_image_resize = "6"

[[bin]]
name = "overview-track"
path = "src/bin/overview-track.rs"

[[bin]]
name = "scrim-positions"
path = "src/bin/scrim-positions.rs"

[[bin]]
name = "targets-probe"
path = "src/bin/targets-probe.rs"
